<!DOCTYPE html>
<html>
<head>
<title>Weather App</title>

<style>

body{
    background:#0f172a;
    color:white;
    text-align:center;
    font-family:Arial;
    margin-top:100px;
}

button{
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}

#result{
    margin-top:30px;
    font-size:35px;
}

</style>

</head>
<body>

<button onclick="getWeather()">
Show Weather
</button>

<div id="result"></div>

<script>

async function getWeather(){

let apiKey = "YOUR_API_KEY";

let url =
"https://api.openweathermap.org/data/2.5/weather?q=Kandahar&appid=" + apiKey + "&units=metric";

let response = await fetch(url);

let data = await response.json();

let weather = data.weather[0].main;

let temp = data.main.temp;

let message = "";

if(weather == "Clear"){
    message = "☀️ Clear Sky";
}

else if(weather == "Clouds"){
    message = "☁️ Clouds";
}

else if(weather == "Rain"){
    message = "🌧 Rain";
}

else if(weather == "Mist"){
    message = "🌫 Mist";
}

else if(weather == "Thunderstorm"){
    message = "⛈ Storm";
}

else if(temp > 30){
    message = "🔥 Very Hot";
}

else if(temp < 10){
    message = "❄️ Cold";
}

document.getElementById("result").innerHTML =
`
<h1>${message}</h1>
<h2>${temp} °C</h2>
`;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            color: #00ffcc;
            text-align: center;

        }

        .container{
            background: #111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 1 1 25px #00ffcc;
            width: 340px;
        }
        video{
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
        }
        button{
            margin-top: 15px;
            padding: 10x 20px ;
            border: none;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>Camra Scanner</h2>
        <p>Click below to canra</p>
        <button onclick="camra()">camra</button>
        <video id="video" src="" autoplay></video>
    </div>

    <script>

        async function camra(){

    try{
        const stream=await navigator.mediaDevices.getUserMedia({video:true});

        const video=document.getElementById("video");

        video.srcObject=stream;

    }

    catch(err){
        alert("camra acces denid");
    }
}

    </script>

</body>
</html>
